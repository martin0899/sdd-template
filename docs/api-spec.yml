# Neutral OpenAPI skeleton: skill `sdd-onboard-project` fills it with the project stack.
openapi: 3.0.0
info:
  title: "{{project_name}} API"
  version: 0.1.0
  description: |
    Placeholder contract. Replace it with the real endpoints of the project
    during onboarding (skill `sdd-onboard-project`).
servers:
  - url: "{{base_url}}"
paths:
  /health:
    get:
      summary: Health check
      description: Reports whether the service is up.
      responses:
        '200':
          description: The service is up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
components:
  schemas: {}
